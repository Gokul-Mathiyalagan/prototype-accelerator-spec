- id: T-001
  phase: 0
  title: Repo scaffold and quality gates
  goal: A uv workspace with the nine packages, tooling, and CI, so every later task has a green baseline.
  spec: [spec/01-architecture.md#packages, spec/01-architecture.md#platform-repo-layout, spec/07-conventions.md]
  depends_on: []
  needs: []
  paths: [pyproject.toml, uv.lock, Makefile, packages/, .pre-commit-config.yaml, .github/workflows/ci.yml, .importlinter, .semgrep/, accel.toml.example, .gitignore]
  acceptance:
    - "uv workspace with the nine packages from spec/01, each with src/ layout, py.typed, and a smoke test"
    - "Makefile targets: setup, check, test, test-live, schemas, golden, handoff-check, sync-agent-files"
    - "make check runs ruff, pyright strict, import-linter (the import rules in spec/01), shellcheck, the AI-endpoint Semgrep guard, and pytest -m 'not live'; it passes"
    - "pytest markers live_azure, live_copilot, live_rea, live_ghidra, live_work_repos are registered and skipped by default"
    - "The AI-endpoint guard (spec/06) fails on a planted 'import anthropic' in a test fixture package, and passes on the real tree"
    - "CI workflow runs make check on push and pull request"
    - ".gitignore covers work/, knowledge/, .venv, and build outputs"
  status: done
  owner: codex
  progress: "Merged into main at Gokul's request; nine typed packages, CI and quality gates complete; 34 offline tests pass."

