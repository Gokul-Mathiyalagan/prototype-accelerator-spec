[project]
name = "accel-package"
version = "0.1.0"
description = "Copilot asset packaging and synchronization."
requires-python = ">=3.12,<3.13"
dependencies = ["accel-core==0.1.0", "accel-skills==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accel_package"]
