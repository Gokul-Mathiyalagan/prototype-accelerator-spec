[project]
name = "accel-mcp"
version = "0.1.0"
description = "Local stdio workflow and code graph MCP tools."
requires-python = ">=3.12,<3.13"
dependencies = ["accel-core==0.1.0", "accel-extract==0.1.0", "accel-sdlc==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accel_mcp"]
