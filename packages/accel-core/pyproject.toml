[project]
name = "accel-core"
version = "0.1.0"
description = "Contracts, configuration, errors, and shared infrastructure."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accel_core"]
