[project]
name = "team-insights-service"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "pyjwt[crypto]==2.10.1",
    "httpx==0.28.1",
    "openai==1.58.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
